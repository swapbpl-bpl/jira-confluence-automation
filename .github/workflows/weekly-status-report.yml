name: Weekly Status Report

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate and commit report
        run: |
          report_path="$(python -c 'from scripts.generate_status_report import previous_week_window; start, end = previous_week_window(); print(f"status-reports/status-report-{start}-to-{end}.md")')"
          python scripts/generate_status_report.py --output "$report_path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$report_path"
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "chore: add weekly status report"
          git push